<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kit Suporte PowerShell - Demonstração</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 20px;
        }
        .terminal-container {
            max-width: 1440px;
            margin: 0 auto;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .terminal-header {
            background: #21262d;
            border-bottom: 1px solid #30363d;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .traffic-light { width: 12px; height: 12px; border-radius: 50%; }
        .traffic-light.close { background: #ff5f57; }
        .traffic-light.minimize { background: #febc2e; }
        .traffic-light.maximize { background: #28ca42; }
        .terminal-title { flex: 1; color: #8b949e; font-size: 13px; text-align: center; }
        .terminal-body {
            padding: 20px;
            min-height: 600px;
        }
        .prompt-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .prompt-user { color: #7ee787; }
        .prompt-path { color: #79c0ff; }
        .prompt-symbol { color: #f2cc60; }
        .command { color: #e6edf3; }
        .output { color: #8b949e; white-space: pre-wrap; word-wrap: break-word; margin-left: 16px; margin-bottom: 16px; line-height: 1.6; }
        .output-table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
        .output-table th, .output-table td { border: 1px solid #30363d; padding: 6px 10px; text-align: left; }
        .output-table th { background: #21262d; color: #f2cc60; }
        .output-table tr:nth-child(even) { background: #1c2128; }
        .section-divider { color: #f2cc60; margin: 24px 0 12px; border-top: 1px dashed #30363d; padding-top: 12px; }
        .success { color: #7ee787; }
        .warning { color: #d29922; }
        .error { color: #f85149; }
        .info { color: #79c0ff; }
        .cursor { display: inline-block; width: 8px; height: 20px; background: #e6edf3; animation: blink 1s infinite; vertical-align: middle; }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <div class="traffic-light close"></div>
            <div class="traffic-light minimize"></div>
            <div class="traffic-light maximize"></div>
            <div class="terminal-title">PS C:\Users\Suporte\kit-suporte-powershell</div>
        </div>
        <div class="terminal-body" id="terminalBody"></div>
    </div>

    <script>
        const commands = [
            {
                cmd: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass',
                output: '',
                delay: 500
            },
            {
                cmd: '.\\scripts\\Get-InventarioPC.ps1',
                output: `Computador     : SUPORTE-PC01
Fabricante     : Dell Inc.
Modelo         : OptiPlex 7090
MemoriaBytes   : 17179869184
Serial         : 8F2K3J1
Processador    : Intel(R) Core(TM) i7-10700 CPU @ 2.90GHz
Sistema        : Microsoft Windows 11 Pro
Versao         : 10.0.22631
UltimoBoot     : 27/11/2026 08:15:23
IP             : 192.168.1.45; fe80::a1b2:c3d4:e5f6:7890
Discos         : C: (452341231616 bytes livres de 1000202240000); D: (214748364800 bytes livres de 500105240576)`,
                delay: 1500
            },
            {
                cmd: '.\\scripts\\Test-RedeBasico.ps1 -DestinoInternet example.com -Portas 80,443',
                output: `Teste                     Status  TempoMs Detalhe
------                    ------  ------- -------
Gateway                   OK          2
DNS: example.com          OK         15
Internet: example.com     OK         28
TCP: example.com:80       OK         31
TCP: example.com:443      OK         35`,
                delay: 2000
            },
            {
                cmd: '.\\scripts\\Get-SaudeDisco.ps1',
                output: `Nome  TamanhoGB LivreGB PercentualLivre Status
----  --------- ------- --------------- ------
C:    931       421     45              OK
D:    466       200     43              OK`,
                delay: 1200
            },
            {
                cmd: '.\\scripts\\Get-SoftwareInstalado.ps1 -Saida .\\software.csv',
                output: `Nome                            Versao     Fabricante           DataInstalacao
----                            ------     ----------           --------------
Git                             2.46.0     Git SCM              15/03/2024
Visual Studio Code              1.94.0     Microsoft Corp.      10/10/2024
7-Zip                           24.05      Igor Pavlov          22/01/2024
Google Chrome                   131.0.6778  Google LLC          05/11/2024
PowerShell 7                    7.4.6      Microsoft Corp.      18/09/2024
... (42 itens no total, exportados para .\\software.csv)`,
                delay: 1500
            },
            {
                cmd: '.\\scripts\\Clear-ArquivosTemporarios.ps1 -WhatIf',
                output: `[WhatIf] A operação seria executada em: C:\\Users\\Suporte\\AppData\\Local\\Temp
[WhatIf] 1.847 arquivos seriam removidos (124,56 MB)
[WhatIf] Lixeira: 23 itens (45,2 MB) - seria esvaziada
[WhatIf] Logs do Windows: C:\\Windows\\Temp - 312 arquivos (8,7 MB) - seria limpo
[WhatIf] Total estimado: 178,46 MB seriam liberados`,
                delay: 1800
            },
            {
                cmd: '.\\scripts\\Repair-FilaImpressao.ps1 -WhatIf',
                output: `[WhatIf] Verificando serviço Spooler...
[WhatIf] Serviço Spooler: Running
[WhatIf] Parando serviço Spooler...
[WhatIf] Limpando C:\\Windows\\System32\\spool\\PRINTERS\\ (12 arquivos)
[WhatIf] Iniciando serviço Spooler...
[WhatIf] Fila de impressão reparada com sucesso.
(Execute sem -WhatIf como Administrador para aplicar)`,
                delay: 1500
            },
            {
                cmd: '.\\scripts\\New-RelatorioSuporte.ps1 -Saida .\\relatorio.html',
                output: `Coletando inventário... OK
Testando rede... OK
Verificando discos... OK
Coletando software instalado... OK
Gerando relatório HTML...
Relatório salvo em: C:\\Users\\Suporte\\kit-suporte-powershell\\relatorio.html
Abra no navegador para visualizar.`,
                delay: 2000
            }
        ];

        const terminalBody = document.getElementById('terminalBody');
        let commandIndex = 0;

        function typeCommand(cmd, callback) {
            const promptLine = document.createElement('div');
            promptLine.className = 'prompt-line';
            promptLine.innerHTML = `
                <span class="prompt-user">suporte</span>
                <span class="prompt-path">@SUPORTE-PC01</span>
                <span class="prompt-symbol">></span>
                <span class="command" id="cmd-${commandIndex}"></span>
                <span class="cursor" id="cursor-${commandIndex}"></span>
            `;
            terminalBody.appendChild(promptLine);
            const cmdEl = document.getElementById(`cmd-${commandIndex}`);
            const cursorEl = document.getElementById(`cursor-${commandIndex}`);
            let i = 0;
            function typeChar() {
                if (i < cmd.length) {
                    cmdEl.textContent += cmd[i];
                    i++;
                    setTimeout(typeChar, 30 + Math.random() * 40);
                } else {
                    cursorEl.remove();
                    setTimeout(callback, 300);
                }
            }
            typeChar();
        }

        function showOutput(output, callback) {
            const outputDiv = document.createElement('div');
            outputDiv.className = 'output';

            // Check if output contains table
            if (output.includes('\t') || (output.includes('  ') && output.split('\n').some(l => l.split(/\s{2,}/).length > 2))) {
                const lines = output.trim().split('\n');
                if (lines.length > 1) {
                    const headers = lines[0].split(/\s{2,}|\t/).filter(h => h);
                    if (headers.length > 1) {
                        let tableHtml = '<table class="output-table"><thead><tr>';
                        headers.forEach(h => tableHtml += `<th>${h}</th>`);
                        tableHtml += '</tr></thead><tbody>';
                        for (let i = 1; i < lines.length; i++) {
                            const cells = lines[i].split(/\s{2,}|\t/).filter(c => c);
                            if (cells.length > 0) {
                                tableHtml += '<tr>';
                                cells.forEach(c => tableHtml += `<td>${c}</td>`);
                                tableHtml += '</tr>';
                            }
                        }
                        tableHtml += '</tbody></table>';
                        outputDiv.innerHTML = tableHtml;
                    } else {
                        outputDiv.textContent = output;
                    }
                } else {
                    outputDiv.textContent = output;
                }
            } else {
                outputDiv.textContent = output;
            }

            terminalBody.appendChild(outputDiv);
            outputDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
            setTimeout(callback, 500);
        }

        function runNextCommand() {
            if (commandIndex >= commands.length) {
                // Add final prompt
                const promptLine = document.createElement('div');
                promptLine.className = 'prompt-line';
                promptLine.innerHTML = `
                    <span class="prompt-user">suporte</span>
                    <span class="prompt-path">@SUPORTE-PC01</span>
                    <span class="prompt-symbol">></span>
                    <span class="cursor"></span>
                `;
                terminalBody.appendChild(promptLine);
                promptLine.scrollIntoView();
                return;
            }
            const { cmd, output, delay } = commands[commandIndex];
            typeCommand(cmd, () => {
                if (output) {
                    showOutput(output, () => {
                        commandIndex++;
                        setTimeout(runNextCommand, delay);
                    });
                } else {
                    commandIndex++;
                    setTimeout(runNextCommand, delay);
                }
            });
        }

        // Start after a brief delay
        setTimeout(runNextCommand, 800);
    </script>
</body>
</html>
